apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kmg-shipping-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KerimMGokmen/kmg-shipping-challenge.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: kmg-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
